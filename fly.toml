# fly.toml app configuration file generated for cuando-pasa on 2026-11-13T19:32:16Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'cuando-pasa'
primary_region = 'gru'

[build]
[env]
  DB_PATH = '/data/cuando-pasa.db'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/salud'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
